<style>

.title-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;text-align:center;position:relative}

.title-content .sub{font-size:0.8rem;color:var(--text-dim);letter-spacing:0.18em;line-height:2.8;margin-bottom:10px}

.api-panel-title{font-size:0.72rem;color:var(--gold);letter-spacing:0.15em;margin-bottom:14px;text-align:center;opacity:0.7}

.svc-btn .svc-name{font-size:0.82rem;color:var(--text-bright);flex:1;pointer-events:none}

.report .rl{font-size:0.64rem;letter-spacing:0.2em;color:rgba(180,140,60,0.5);margin-bottom:10px}
.report .ri{font-size:0.88rem;line-height:2.2;padding-left:20px;position:relative;margin-bottom:2px}

.free-input-wrap{margin-top:20px;opacity:0;transition:opacity 0.8s}.free-input-wrap.visible{opacity:1}

.tw-cursor::after{content:'';display:inline-block;width:1px;height:1em;background:var(--gold);opacity:0.5;animation:twblink 0.8s step-end infinite;vertical-align:text-bottom;margin-left:2px}

.speech-panel.hawk{border-left:3px solid var(--crimson)}.speech-panel.dove{border-left:3px solid var(--blue)}

.cfig{display:flex;flex-direction:column;align-items:center;position:relative;transition:all 0.6s ease;cursor:default}

.cfig[data-char="oguri"] img{filter:brightness(0.2) sepia(1) saturate(5) hue-rotate(-20deg) brightness(0.8)}
.cfig[data-char="katsu"] img{filter:brightness(0.2) sepia(1) saturate(3) hue-rotate(180deg) brightness(0.7)}
.cfig[data-char="matsudaira"] img{filter:brightness(0.2) sepia(1) saturate(3) hue-rotate(100deg) brightness(0.7)}

.cfig-name{font-size:0.6rem;letter-spacing:0.1em;color:var(--text-dim);text-align:center;margin-top:10px;opacity:0.3;transition:all 0.5s}
.cfig[data-char="oguri"]{--cc:var(--crimson)}.cfig[data-char="katsu"]{--cc:var(--blue)}.cfig[data-char="matsudaira"]{--cc:var(--green)}
.cfig.loading img{animation:shimmer 2s ease infinite}
@keyframes shimmer{0%,100%{opacity:0.3}50%{opacity:0.7}}
.cfig.ready{cursor:pointer;animation:pulseGlow 2s ease-in-out infinite}
.cfig.ready .cfig-name{opacity:0.7}

@keyframes pulseGlow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px var(--cc))}}
.council-choices{margin-top:8px}
@media(max-width:480px){#game{padding:36px 16px 80px}.title-content h1{font-size:1.9rem}.scene-viz{height:220px}.api-panel{padding:16px 14px}#svc-modal-inner{padding:18px 16px}.stage-figures{gap:28px}.cfig img{width:64px;height:96px}.speech-panel.visible{padding:16px 18px}}
</style>
</head>

async function readSSE(res,pfn,oc){const r=res.body.getReader(),d=new TextDecoder();let buf='',out='';while(true){const{done,value}=await r.read();if(done)break;buf+=d.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const l of lines){const t=l.trim();if(t.startsWith('data: ')){const s=t.substring(6).trim();if(s==='[DONE]')return out;try{const j=JSON.parse(s);const txt=pfn(j);if(txt){out+=txt;if(oc)oc(txt);}}catch(e){}}}}return out;}

async function callO(msgs,s,oc){const r=await ft(s.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:s.model,messages:msgs,temperature:0.85,max_tokens:300,stream:true})},30000);if(!r.ok)throw new Error(await r.text());return readSSE(r,j=>j.choices?.[0]?.delta?.content,oc);}

async function callOR(msgs,oc){const h={'Content-Type':'application/json','Authorization':'Bearer '+apiKey,'HTTP-Referer':location.href,'X-Title':'大政奉還'};for(let i=0;i<OR_FREE.length;i++){const idx=(orIdx+i)%OR_FREE.length;try{const r=await ft(SVC['openrouter-free'].url,{method:'POST',headers:h,body:JSON.stringify({model:OR_FREE[idx],messages:msgs,temperature:0.85,max_tokens:300,stream:true})},20000);if(!r.ok)continue;const res=await readSSE(r,j=>j.choices?.[0]?.delta?.content,oc);if(res){orIdx=idx;return res;}}catch(e){continue;}}throw new Error('全ての無料モデルが利用できません');}

const CS={resp:{},read:new Set(),total:0,rn:0};
const ARROW={oguri:'28%',katsu:'50%',matsudaira:'72%'};

function buildStageHTML(){return `<div class="speech-panel" id="spPanel"><span class="speech-name" id="spName"></span><div class="speech-text" id="spText"></div></div><div class="stage-guide" id="stGuide"></div><div class="stage-figures"><div class="cfig" data-char="oguri" onclick="reveal('oguri')">${figImg(IMG_OGURI)}<div class="cfig-name">小栗上野介</div></div><div class="cfig" data-char="katsu" onclick="reveal('katsu')">${figImg(IMG_KATSU)}<div class="cfig-name">勝麟太郎</div></div><div class="cfig" data-char="matsudaira" onclick="reveal('matsudaira')">${figImg(IMG_MATSUDAIRA)}<div class="cfig-name">松平容保</div></div></div>`;}

async function runCouncil(cids,ctx,rn){CS.resp={};CS.read=new Set();CS.total=cids.length;CS.rn=rn;const pm=S.councilLog.length>0?S.councilLog[S.councilLog.length-1].text:'各々の存分を述べよ。';const guide=document.getElementById('stGuide');const panel=document.getElementById('spPanel');if(panel)panel.className='speech-panel';cids.forEach(cid=>{const fig=document.querySelector(`.cfig[data-char="${cid}"]`);if(fig){fig.classList.remove('ready','active','read');fig.classList.add('loading');}});guide.textContent='── 各臣下が考え中 ──';for(const cid of cids){try{CS.resp[cid]=await AI.speak(cid,ctx,pm);}catch(e){CS.resp[cid]='……（沈黙）';}const fig=document.querySelector(`.cfig[data-char="${cid}"]`);if(fig){fig.classList.remove('loading');fig.classList.add('ready');}}guide.textContent='── シルエットをクリック ──';}

function reveal(cid){if(!CS.resp[cid])return;CS.read.add(cid);document.querySelectorAll('.cfig').forEach(f=>f.classList.remove('active'));const fig=document.querySelector(`.cfig[data-char="${cid}"]`);if(fig){fig.classList.add('active','read');}const ch=CHARS[cid];const panel=document.getElementById('spPanel');panel.style.setProperty('--arrow-x',ARROW[cid]||'50%');panel.className=`speech-panel ${ch.cls} visible`;document.getElementById('spName').textContent=ch.name;document.getElementById('spText').innerHTML=fmtTxt(CS.resp[cid]);const rem=CS.total-CS.read.size;const guide=document.getElementById('stGuide');if(rem>0){guide.textContent=`── 残り${rem}人 ──`;}else{guide.textContent='';setTimeout(()=>showChoices(CS.rn),600);}}

function fmtTxt(t){return t.replace(/\n/g,'<br>').replace(/「(.+?)」/g,'「$1」').replace(/\*(.+?)\*/g,'<em>$1</em>');}

function addPlayerMsg(text){const panel=document.getElementById('spPanel');document.querySelectorAll('.cfig').forEach(f=>f.classList.remove('active'));panel.style.setProperty('--arrow-x','50%');panel.className='speech-panel yoshinobu visible';document.getElementById('spName').textContent='徳川慶喜';document.getElementById('spText').innerHTML=fmtTxt(text);S.councilLog.push({name:'慶喜',text});}

function showChoices(rn){const w=document.querySelector('.council-choices');if(!w)return;const k=S.direction>=2?'pro_taisei':S.direction<=-2?'pro_force':'undecided';const pool=CC[rn-1]?.[k]||CC[rn-1]?.default||[];let h='<div class="choices visible">';pool.forEach(c=>{h+=`<button class="choice" onclick="ccChoice(${rn},'${c.id}',${JSON.stringify(JSON.stringify(c.fx))},this)">${c.text}</button>`;});h+='</div>';h+=`<div class="free-input-wrap visible"><textarea class="free-input" id="freeInput" placeholder="慶喜として発言する（任意）"></textarea><button class="free-send" onclick="ccFree(${rn})">発言する</button></div>`;w.innerHTML=h;}

async function ccChoice(rn,cid,ej,btn){apFx(JSON.parse(ej));addPlayerMsg(btn.textContent.trim());document.querySelector('.council-choices').innerHTML='';await new Promise(r=>setTimeout(r,1000));await nextRound(rn);}
async function ccFree(rn){const inp=document.getElementById('freeInput');const t=inp.value.trim();if(!t)return;addPlayerMsg(t);document.querySelector('.council-choices').innerHTML='';S.direction+=(S.resolve>=5?1:-1);S.resolve+=1;await new Promise(r=>setTimeout(r,1000));await nextRound(rn);}
async function nextRound(rn){const panel=document.getElementById('spPanel');if(panel)panel.className='speech-panel';if(rn>=3){setTimeout(()=>go(S._end||'intermission'),1500);}else{await runCouncil(['oguri','katsu','matsudaira'],buildCtx(),rn+1);}}

function buildCtx(){let c=`【場面】二条城の評議の間。将軍慶喜と家臣たちの密談。\n【日付】慶応3年10月${22+S.day}日\n【これまでに分かっている情報】\n`;if(S.info>=2)c+=`- 薩摩の西郷隆盛が何者かと密会している\n`;if(S.info>=3)c+=`- 土佐藩の後藤象二郎が京都に滞在。大政奉還の建白書を提出した模様\n`;if(S.info>=4)c+=`- 大久保利通と西郷が頻繁に連絡を取り合っている\n`;if(S.info>=5)c+=`- 薩摩と土佐が共同で大政奉還を推進する動きがある\n`;if(S.info>=6)c+=`- 建白書の内容: 将軍職を辞し政権を朝廷に返上\n`;if(S.anxiety>=3)c+=`- 長州藩が兵の集結を進めている\n`;if(S.anxiety>=5)c+=`- 薩摩と長州が密かに連絡を取っているという未確認情報がある\n`;if(S.day>=2)c+=`- 英国公使パークスが大坂に到着\n`;c+=`\n【慶喜の傾向】${S.direction>=2?'大政奉還に傾いている':S.direction<=-2?'武力討伐に傾いている':'まだ決めていない'}\n家臣たちに正直に意見を述べよ。`;return c;}

const CC=[{pro_taisei:[{id:'rt1a',text:'「大政奉還の案を前向きに検討している。各々の忌憚のない意見を聞かせよ」',fx:{direction:2,resolve:2}},{id:'rt1b',text:'「薩摩が大政奉還を支持するなら我々も検討すべきではないか」',fx:{direction:3,resolve:1}}],pro_force:[{id:'rf1a',text:'「薩長の動きは謀叛だ。征討すべきか各々の見解を述べよ」',fx:{direction:-2,resolve:2}},{id:'rf1b',text:'「武力で制する覚悟はあるか。正直に申せ」',fx:{direction:-3,resolve:3}}],default:[{id:'rd1a',text:'「正直に申せ。お前たちは何を考えている」',fx:{resolve:2}},{id:'rd1b',text:'「情報が足りぬ。もう少し聞いてから判断する」',fx:{anxiety:1}}]},{pro_taisei:[{id:'rt2a',text:'「大政奉還を決めれば血は流れない。それが一番ではないか」',fx:{direction:2,resolve:2,anxiety:-1}},{id:'rt2b',text:'「……だが三百年の天下を手放す重さを朕は背負えるのか」',fx:{resolve:1,anxiety:2}}],pro_force:[{id:'rf2a',text:'「戦えば勝てる確証はあるのか。勝麟太郎お前はどう思う」',fx:{resolve:1,anxiety:1}},{id:'rf2b',text:'「……負ければ徳川は終わる。だが負けても戦うのが武士ではないか」',fx:{direction:-1,resolve:2}}],default:[{id:'rd2a',text:'「もう一度聞かせてくれ。お前たちの本心を」',fx:{resolve:1,info:1}},{id:'rd2b',text:'「……朕にまだ時間が必要だ」',fx:{anxiety:2,resolve:-1}}]},{pro_taisei:[{id:'rt3a',text:'「……分かった。大政奉還を決断する。上表書を用意させよ」',fx:{direction:3,resolve:4}},{id:'rt3b',text:'「もう少し考えさせてくれ。だが方向性は見えてきた」',fx:{direction:1,resolve:2}}],pro_force:[{id:'rf3a',text:'「征討の準備を進めよ。……朕が責任を取る」',fx:{direction:-3,resolve:4}},{id:'rf3b',text:'「……まだ決せぬ。だが戦う覚悟はしておけ」',fx:{direction:-1,resolve:2}}],default:[{id:'rd3a',text:'「全員下去れ。……朕が一人で決める」',fx:{resolve:3,anxiety:1}},{id:'rd3b',text:'「……もう一度朝に集まれ。朕の答えはまだ出ぬ」',fx:{anxiety:3,resolve:-1}}]}];

function apFx(e){if(e.anxiety!==undefined)S.anxiety+=e.anxiety;if(e.info!==undefined)S.info+=e.info;if(e.resolve!==undefined)S.resolve+=e.resolve;if(e.direction!==undefined)S.direction+=e.direction;S.anxiety=Math.max(0,Math.min(10,S.anxiety));S.info=Math.max(0,Math.min(10,S.info));S.resolve=Math.max(0,Math.min(10,S.resolve));}

// Scenes

const scenes={

title:{type:'title',html:`<div class="title-wrap"><div class="title-viz"><canvas id="cv"></canvas></div><div class="title-content"><h1>大政奉還</h1><div class="sub">慶応三年 十月 ── 二条城</div><div class="musing">「朕は、何を決めなければならないのか」</div><div class="api-panel"><div class="api-panel-title">─ AIサービスを選択 ─</div><div class="svc-grid" id="titleSvcGrid"></div><div id="key-section"><label id="key-label">Gemini APIキー</label><input id="api-key-input" type="password" placeholder="AIzaSy..."><div id="key-warning" class="ok">ai.google.dev から取得</div><div id="svc-info">モデル: gemini-2.0-flash（高速・無料枠あり）</div></div></div><button class="begin" onclick="startGame()">開　始</button></div></div>`,after:()=>{runCanvas(document.getElementById('cv'),drawTitle);initSvcGrid()}},

s1:{type:'scene',bgm:'chamber',html:`<div class="scene-viz"><canvas id="cv"></canvas><span class="sl">二条城 書斎</span></div><div class="dialogue"><span class="sp retainer">側近</span><div class="line">──上様。夜分にもかかわらず、お耳に入れねばならぬことがございまして。</div></div><div class="report"><div class="rl">偵察報告 ── 十月二十三日 亥の刻</div><div class="ri c">薩摩藩の西郷隆盛が、昨夜、四条小橋裏の料亭に赴いた</div><div class="ri c">同所にて何者かと密会。およそ二刻ほどで退出</div><div class="ri u">密会の相手の素性</div><div class="ri h">土佐藩の者という噂がある（出典：町人、信頼度：低）</div></div><div class="ithought">（西郷隆盛。薩摩の実力者だ。何者かと密会した。何の目的で。そして、なぜ今）</div><div class="choices" data-scene="s1"><button class="choice" onclick="choose('s1','investigate')">「相手を詮索せよ。何者かなどとは承服できぬ」</button><button class="choice" onclick="choose('s1','okubo')">「大久保の動きはどうだ。西郷だけで動く男ではない」</button><button class="choice" onclick="choose('s1','dismiss')">「……それだけか。下去れ」</button></div>`,after:()=>{runCanvas(document.getElementById('cv'),drawChamber)},fx:{investigate:{info:2,anxiety:1},okubo:{info:1,direction:-1},dismiss:{anxiety:2,resolve:-1}}},

s2:{type:'scene',bgm:'chamber',build(){let r;if(S.choices.includes('investigate')){r=`<div class="report"><div class="rl">偵察報告 追加 ── 十月二十四日 寅の刻</div><div class="ri c">西郷の密会の相手は土佐藩関係者である可能性が高い</div><div class="ri c">土佐藩参政・後藤象二郎が近日京都に滞在していることが判明</div><div class="ri u">後藤と西郷が直接会った確証</div><div class="ri c">さらに土佐藩より朝廷に対し何らかの建白書が提出された模様</div><div class="ri u">建白書の詳細な内容</div><div class="ri h">「政権を朝廷に返上すべし」との趣旨（未確認）</div></div>`;}else if(S.choices.includes('okubo')){r=`<div class="report"><div class="rl">偵察報告 追加 ── 十月二十四日 寅の刻</div><div class="ri c">大久保利通が西郷と頻繁に連絡を取り合っている</div><div class="ri c">両名とも京都に滞在。通常の業務連絡にしては密接すぎる</div><div class="ri h">土佐藩との接触という噂があるが大久保側は否定</div><div class="ri c">土佐藩より朝廷に建白書が提出された模様</div><div class="ri u">建白書の内容</div><div class="ri h">「政権の返上」を求める趣旨との噂（出典不明）</div></div>`;}else{r=`<div class="report"><div class="rl">偵察報告 ── 十月二十四日 寅の刻</div><div class="ri c">土佐藩より朝廷に対し何らかの建白書が提出された模様</div><div class="ri u">建白書の内容は「政権を朝廷に返上すべし」との趣旨という噂</div><div class="ri u">薩摩との関連</div><div class="ri h">薩摩と土佐が連携しているという話は以前からある（確証なし）</div></div>`;}return `<div class="scene-viz"><canvas id="cv"></canvas><span class="sl">書斎 ── 文書</span></div>${r}<div class="report"><div class="rl">並行情報 ── 同日</div><div class="ri c">長州藩が兵の集結を進めている模様</div><div class="ri u">目的。規模。時期</div><div class="ri h">薩摩と長州が密かに連絡を取っているという情報がある（未確認）</div></div><div class="ithought">（政権を返上せよ、だと。……徳川三百年の天下をたやすく手放せと？<br>だが長州の動きが止まらぬのも事実だ。<br>……全てが同時に動いている。朕だけが何も見えぬ）</div><div class="choices" data-scene="s2"><button class="choice" onclick="choose('s2','petition')">「建白書の内容を精査せよ。一文字も逃すな」</button><button class="choice" onclick="choose('s2','military')">「長州の兵力を詮索せよ。数と装備と指揮官は誰だ」</button><button class="choice" onclick="choose('s2','connect')">「薩摩と土佐と長州。この三者が繋がっているのか」</button></div>`},after:()=>{runCanvas(document.getElementById('cv'),drawChamber)},fx:{petition:{direction:2,info:2},military:{anxiety:2,direction:-1,info:1},connect:{info:3,resolve:1}}},

s3:{type:'scene',council:true,bgm:'council',build(){return `<div class="scene-viz"><canvas id="cv"></canvas><span class="sl">評議の間</span></div><div class="ithought">（集まった。小栗上野介。勝麟太郎。松平容保。<br>三人の顔ぶれを見れば意見が割れていることは明白だ。<br>──いや、持っていぬのは朕も同じだ）</div><div class="sep">───</div><div class="council-stage" id="councilStage">${buildStageHTML()}</div><div class="council-choices" id="councilChoices"></div>`;},after:async()=>{runCanvas(document.getElementById('cv'),drawCouncilBg);AI.reset('oguri');AI.reset('katsu');AI.reset('matsudaira');S.councilLog=[];S._end='intermission';await TW.typeScene();await runCouncil(['oguri','katsu','matsudaira'],buildCtx(),1);}},

intermission:{type:'scene',bgm:'chamber',build(){S.day=2;return `<div class="scene-viz"><canvas id="cv"></canvas><span class="sl">二の丸 奥御殿</span></div><div class="dialogue"><span class="sp retainer">側近</span><div class="line">──上様。評議の後さらに情報が入っております。</div></div><div class="report"><div class="rl">緊急報告 ── 十月二十五日 丑の刻</div><div class="ri c">英国公使パークスが大坂に到着。「新政府樹立の際は速やかに承認する用意がある」との伝言</div><div class="ri u">「新政府」の定義</div><div class="ri h">薩摩が英国と水面下で接触しているという情報がある（未確認）</div></div><div class="report"><div class="rl">追加報告</div><div class="ri c">長州藩の兵が大坂方面に進軍中。規模は未確認だが数千規模との噂</div><div class="ri c">朝廷内では三条実美・岩倉具視が密かに動き始めている</div><div class="ri u">岩倉が薩摩に討幕の密勅を画策しているという噂</div><div class="ri h">密勅が下れば幕府は「朝敵」になる（出典：公家方の側近、信頼度：中）</div></div><div class="ithought">（英国が「新政府」の承認を用意している。<br>つまり英国はすでに幕府の終焉を前提に動いている。<br>そして討幕の密勅。それが下れば──朕は朝敵だ。<br>……時間が無い）</div><div class="choices" data-scene="intermission"><button class="choice" onclick="choose('intermission','study')">「英国の伝言を精査せよ。パークスの真意は何だ」</button><button class="choice" onclick="choose('intermission','counter')">「討幕の密勅を阻止する手立てはないのか」</button><button class="choice" onclick="choose('intermission','reflect')">「……一人にしてくれ。朕は少し考えたい」</button></div>`;},after:()=>{runCanvas(document.getElementById('cv'),drawChamber)},fx:{study:{info:3,direction:1},counter:{anxiety:2,resolve:2,direction:-1},reflect:{anxiety:1,resolve:2}}},

s4:{type:'scene',council:true,bgm:'council',build(){return `<div class="scene-viz"><canvas id="cv"></canvas><span class="sl">評議の間 ── 第二夜</span></div><div class="ithought">（再び集まった。今夜は先の夜とは違う。<br>英国の動き。討幕の密勅。長州の進軍。情報は増えたが答えは見えていない）</div><div class="sep">───</div><div class="council-stage" id="councilStage">${buildStageHTML()}</div><div class="council-choices" id="councilChoices"></div>`;},after:async()=>{runCanvas(document.getElementById('cv'),drawCouncilBg);AI.reset('oguri');AI.reset('katsu');AI.reset('matsudaira');S.councilLog=[];S._end='finale';const ctx=buildCtx()+'\n\n【追加情報】英国パークスの伝言、討幕の密勅の噂、長州の進軍について家臣たちは知っている。';await TW.typeScene();await runCouncil(['oguri','katsu','matsudaira'],ctx,1);}},

finale:{type:'scene',build(){const type=S.resolve>=6?(S.direction>=3?'positive':S.direction<=-3?'negative':'neutral'):'negative';let body;if(type==='positive'){body=`<div class="scene-viz"><canvas id="cv"></canvas><span class="sl">二条城 ── 夜明け</span></div><div class="dialogue"><span class="sp yoshinobu">徳川慶喜</span><div class="line">……上表書を用意させよ。将軍職を辞し政権を朝廷に返上する。</div></div><div class="dialogue"><span class="sp retainer">側近</span><div class="line">……上様。</div></div><div class="dialogue"><span class="sp yoshinobu">徳川慶喜</span><div class="line">……三百年前、家康が天下を取った。その天下を朕が手放す。<br>……笑う者がおろう。憤る者がおろう。構わぬ。これが朕の──<em>結論</em>だ。</div></div><div class="dialogue"><div class="line">鶯張りが鳴った。側近が退出していく。<br>書斎に一人残された慶喜は窓の外を見た。<br>東の空がようやく白み始めていた。三百年の夜が終わろうとしている。</div></div><div class="ending-title">──── 大政奉還 ────</div>`;}else if(type==='negative'){body=`<div class="scene-viz"><canvas id="cv"></canvas><span class="sl">二条城 ── 暗い夜明け</span></div><div class="dialogue"><span class="sp yoshinobu">徳川慶喜</span><div class="line">……もう一日だけ。</div></div><div class="dialogue"><div class="line">そう言った瞬間慶喜は分かっていた。もう一日待っても答えは出ない。<br>情報が増えるたびに迷いは深まるだけだ。だが──決断する勇気がまだ湧いてこない。</div></div><div class="ending-title">──── 迷走 ────</div>`;}else{body=`<div class="scene-viz"><canvas id="cv"></canvas><span class="sl">二条城 ── 判然とせぬ空</span></div><div class="dialogue"><span class="sp yoshinobu">徳川慶喜</span><div class="line">……朕は答えを持たぬまま夜を過ごした。だが空は白み始めた。答えは出ぬまま──時だけが過ぎていく。</div></div><div class="ending-title">──── 未決 ────</div>`;}return body+epilogue();},after:()=>{const type=S.resolve>=6?(S.direction>=3?'positive':S.direction<=-3?'negative':'neutral'):'negative';runCanvas(document.getElementById('cv'),(ctx,W,H,t)=>drawDawn(ctx,W,H,t,type));try{BGM.start(type==='positive'?'dawn':'crisis');}catch(e){}}}};

function epilogue(){return `<div class="epilogue"><div class="hl">───── 史実 ─────</div>慶応三年十月十四日、将軍徳川慶喜は二条城にて二百余年の歴史に幕を下ろす決断をした。大政奉還である。<br><br>この決断の背景には、土佐藩の建白、薩摩との暗黙の合意、長州の軍事的脅迫、英国の思惑、そして家臣たちの分裂があった。<br><br>慶喜本人が後に「朕は常々王政復古を希望していた」と述べた。一方で「仕方なく」との見方もある。<br><br><span style="color:var(--text-dim);font-size:0.76rem">この物語は史実をもとに構成されたフィクションです。</span></div>`;}

// ============================================================
function initSvcGrid(){const g=document.getElementById('titleSvcGrid');if(!g)return;g.innerHTML='';Object.keys(SVC).forEach(k=>{const s=SVC[k];const b=document.createElement('button');b.type='button';b.className='svc-btn'+(k===selSvc?' selected':'');b.innerHTML=`<span class="svc-name">${s.name}</span><span class="svc-tag ${s.tagCls}">${s.tag}</span>`;b.addEventListener('click',()=>{g.querySelectorAll('.svc-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selSvc=k;updKey();});g.appendChild(b);});updKey();}
function updKey(){const s=SVC[selSvc];const ks=document.getElementById('key-section');if(!ks)return;if(!s||!s.kl){ks.classList.add('hidden');return;}ks.classList.remove('hidden');document.getElementById('key-label').textContent=s.kl;const inp=document.getElementById('api-key-input');inp.placeholder=s.ph;inp.value=(localStorage.getItem('ai_svc')===selSvc)?apiKey:'';const wn=document.getElementById('key-warning');if(s.w&&s.w.d){wn.style.display='block';wn.className=s.w.t;wn.textContent=s.w.d;}else wn.style.display='none';const m={gemini:'モデル: gemini-2.0-flash（高速・無料枠あり）','gemini-pro':'モデル: gemini-2.5-pro（最高品質）',mimo:'モデル: MiMo v2.5 Pro',openai:'モデル: gpt-4o-mini','openai-free':'モデル: gpt-4o-mini（制限あり）',claude:'モデル: claude-sonnet-4（制限あり）',groq:'モデル: Llama 3.3 70B','openrouter-free':'無料モデル '+OR_FREE.length+'種を自動切替',demo:''};document.getElementById('svc-info').textContent=m[selSvc]||'';}
function startGame(){if(selSvc!=='demo'){const inp=document.getElementById('api-key-input');apiKey=inp?inp.value.trim().replace(/[^\x00-\x7F]/g,''):'';if(!apiKey){inp.style.borderColor='#993333';inp.focus();document.getElementById('key-warning').style.display='block';document.getElementById('key-warning').className='warn';document.getElementById('key-warning').textContent='APIキーを入力してください';setTimeout(()=>{inp.style.borderColor='';},3000);return;}localStorage.setItem('ai_svc',selSvc);localStorage.setItem('ai_key',apiKey);}else{localStorage.setItem('ai_svc','demo');localStorage.removeItem('ai_key');}document.getElementById('svc-toggle').classList.add('show');document.getElementById('bgm-toggle').classList.add('show');try{BGM.start('chamber');}catch(e){}go('s1');}
function openSvcModal(){const g=document.getElementById('svc-sw-grid');g.innerHTML='';Object.keys(SVC).forEach(k=>{const d=document.createElement('button');d.type='button';d.className='sw-opt'+(k===selSvc?' active':'');d.textContent=SVC[k].name;d.onclick=()=>{g.querySelectorAll('.sw-opt').forEach(o=>o.classList.remove('active'));d.classList.add('active');selSvc=k;const s=SVC[k];document.getElementById('svc-sw-label').textContent=s.kl||'APIキー';document.getElementById('svc-sw-key').placeholder=s.ph||'';document.getElementById('svc-sw-key').value='';document.getElementById('svc-sw-key').style.display=s.url?'':'none';};g.appendChild(d);});const s=SVC[selSvc];document.getElementById('svc-sw-label').textContent=s.kl||'APIキー';document.getElementById('svc-sw-key').placeholder=s.ph||'';document.getElementById('svc-sw-key').value='';document.getElementById('svc-sw-key').style.display=s.url?'':'none';document.getElementById('svc-modal').classList.add('open');}
function closeSvcModal(){document.getElementById('svc-modal').classList.remove('open');}
function applySvcSwitch(){if(selSvc!=='demo'){const k=document.getElementById('svc-sw-key').value.trim().replace(/[^\x00-\x7F]/g,'');if(k)apiKey=k;else if(!apiKey){document.getElementById('svc-sw-key').style.borderColor='#993333';setTimeout(()=>{document.getElementById('svc-sw-key').style.borderColor='';},2000);return;}localStorage.setItem('ai_svc',selSvc);localStorage.setItem('ai_key',apiKey);}else{localStorage.setItem('ai_svc','demo');}if(selSvc==='openrouter-free')orIdx=0;closeSvcModal();}

function render(html){killCanvas();TW.clear();const g=document.getElementById('game');g.innerHTML=html;requestAnimationFrame(()=>{g.querySelectorAll('.scene').forEach((el,i)=>{setTimeout(()=>el.classList.add('visible'),i*120)});});updWh();window.scrollTo({top:0,behavior:'smooth'});}
function go(id){const sc=scenes[id];if(!sc)return;const body=sc.type==='title'?sc.html:`<div class="scene visible">${sc.build?sc.build():sc.html}</div>`;S.phase++;render(body);if(sc.type==='title'){if(sc.after)setTimeout(sc.after,50);return;}if(sc.bgm){try{BGM.start(sc.bgm);}catch(e){}}setTimeout(async()=>{if(sc.after){const r=sc.after();if(r&&r.then)await r;}if(!sc.council){await new Promise(r=>setTimeout(r,100));await TW.typeScene();document.querySelectorAll('#game .choices').forEach(el=>el.classList.add('visible'));document.querySelectorAll('#game .free-input-wrap').forEach(el=>el.classList.add('visible'));}},50);}
function choose(scId,chId){const sc=scenes[scId];if(!sc)return;const fx=sc.fx;if(fx&&fx[chId])apFx(fx[chId]);S.choices.push(chId);const g=document.getElementById('game');g.style.transition='opacity 1s';g.style.opacity='0';setTimeout(()=>{const order=Object.keys(scenes).filter(k=>k!=='title');const idx=order.indexOf(scId);const next=order[idx+1];if(next)go(next);g.style.opacity='1';},1100);}
function updWh(){const bar=document.getElementById('wh');const p=Math.min(1,S.phase/8);const r=Math.round(40+p*80),g=Math.round(30+p*60),b=Math.round(30+p*30);bar.style.background=`linear-gradient(to right,rgb(${r},${g},${b}) ${p*100}%,transparent ${p*100}%)`;}

go('title');
</script>
</body>
</html>
